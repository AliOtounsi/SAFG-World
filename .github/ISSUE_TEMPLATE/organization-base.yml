name: Organization base request
description: Get help with a gang/squad base submission or a manually placed legacy base.
title: "[Base] Organization name"
labels: [organization-base]
body:
  - type: markdown
    attributes:
      value: "For reviewed map uploads, submit a SAFG-World PR and request it in game via Level Settings > Skins & Base. See the README for levels, size limits and the converter format. This issue is for help and legacy placement changes."
  - type: input
    id: organization
    attributes: {label: Organization name}
    validations: {required: true}
  - type: input
    id: account
    attributes: {label: Leader account, description: Your game account name only; never include passwords.}
    validations: {required: true}
  - type: textarea
    id: location
    attributes: {label: Entrance and map location, description: Include x/y/z/rotation and interior/dimension.}
    validations: {required: true}
  - type: textarea
    id: submission
    attributes: {label: Map PR and screenshots, description: Link the PR containing bases/ files and explain the intended placement.}
    validations: {required: true}
